name: Run Index Options NTO Scanner

on:
  schedule:
    # Runs every 15 minutes during market hours (Mon-Fri)
    - cron: '*/15 3-10 * * 1-5'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scanner script
        run: python scanner.py

      - name: Commit and push updated CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git stash || true
          git pull origin main --rebase || true
          git stash pop || true
          git add nto_scan_results.csv
          git commit -m "Auto-update live Index NTO scan results [skip ci]" || exit 0
          git push origin main
